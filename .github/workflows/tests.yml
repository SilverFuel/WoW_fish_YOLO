name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.13']
        exclude:
          # Mac build machines are scarce; one Python version is enough there.
          - os: macos-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The plugin turns each failing test into an annotation on the run.
      - run: python -m pip install -r requirements.txt pytest pytest-github-actions-annotate-failures
      - run: python -m pytest tests -q

  # Runs the real window, capture, key and click code against a test window on a real desktop.
  # Results appear as annotations on the run, and a failed check fails the build.
  desktop-probe:
    name: Desktop probe / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      # One more try if it fails: a shared build machine's desktop is sometimes slow to answer.
      - run: python tools/desktop_probe.py || python tools/desktop_probe.py
        shell: bash

  # Starts the app the way a person does, by its starter, including the one-time set-up.
  # The build machines have several Pythons installed, some too new, so this also checks the starter picks one that works.
  launcher:
    name: Launcher / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python tools/check_launcher.py

  # Opens the page in a real browser against the pretend game and uses it the way a person would.
  page:
    name: Page in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: python tools/check_page.py
